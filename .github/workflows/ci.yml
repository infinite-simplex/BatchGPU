name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Core uses Linux-only APIs (epoll, mmap, multicast sockets, clock_gettime(CLOCK_TAI)).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The key changes whenever the pinned versions in CMakeLists.txt change.
      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

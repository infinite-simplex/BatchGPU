name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Core uses Linux-only APIs (epoll, mmap, multicast sockets, clock_gettime(CLOCK_TAI)).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Do not cache build/_deps: it holds compiled googletest, built with
      # -march=native (see CMakeLists.txt). Restored onto a runner with a
      # different CPU, that library crashes with SIGILL at test teardown.
      # Caching only the downloaded sources does not help either: CMake
      # wipes and re-fetches them. The whole cache saved a few seconds.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
